<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de contador · Mega Rifa Fusa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo+Narrow:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
  :root { --crema:#FFF4D6; --rojo:#C1121F; --amarillo:#F2B705; --azul:#0A3D62; --negro:#1A1A1A; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--crema); color: var(--negro); font-family: 'Archivo Narrow', sans-serif; font-size: 17px; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-family: 'Alfa Slab One', serif; font-weight: 400; color: var(--rojo); margin: 0 0 4px; font-size: 30px; }
  .nota { margin: 0 0 18px; line-height: 1.45; }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; background: #fff; border: 4px solid var(--negro); padding: 16px; }
  label { display: flex; flex-direction: column; gap: 5px; font-weight: 700; }
  label.check { flex-direction: row; align-items: center; gap: 8px; grid-column: 1 / -1; font-weight: 600; }
  input, select { font: inherit; padding: 9px 10px; border: 3px solid var(--negro); background: var(--crema); }
  .ayuda { font-weight: 400; font-size: 14px; }
  #error { margin: 14px 0; padding: 12px 14px; border: 4px solid var(--rojo); background: #fff; color: var(--rojo); font-weight: 700; display: none; }
  .previas { display: grid; grid-template-columns: 1fr 0.6fr; gap: 18px; margin-top: 18px; align-items: start; }
  @media (max-width: 700px) { .previas { grid-template-columns: 1fr; } }
  .previa { border: 4px solid var(--negro); background: #fff; padding: 10px; }
  .previa canvas { width: 100%; height: auto; display: block; border: 1px solid #ccc; }
  button { margin-top: 10px; width: 100%; font-family: 'Alfa Slab One', serif; font-size: 20px; padding: 12px; background: var(--rojo); color: var(--crema); border: 4px solid var(--negro); cursor: pointer; }
  button:disabled { background: #999; cursor: not-allowed; }
  body.solo main > *:not(.previas) { display: none; }
  body.solo main { max-width: none; padding: 0; margin: 0; }
  body.solo .previas { display: block; margin: 0; }
  body.solo .previa { border: 0; padding: 0; }
  body.solo .previa canvas { width: auto; border: 0; }
  body.solo button, body.solo .previa:not(.mostrar) { display: none; }
</style>
</head>
<body>
<main>
  <h1>Generador de contador</h1>
  <p class="nota">Escribe el dato <b>real</b> del tablero de hoy (<b>mega-rifa-fusa.vercel.app</b> o la hoja HOY del Sheet) y descarga las piezas. Si un dato falta o no cuadra, no deja descargar: nunca sale una pieza con una cifra inventada.</p>

  <form id="f" onsubmit="return false">
    <label>Pieza
      <select id="tipo">
        <option value="ya-escogieron">12 oct · Ya escogieron los suyos</option>
        <option value="prueba-social">16 oct · Ya tienen el suyo</option>
        <option value="vamos">18 oct · Recuento (punto de control)</option>
        <option value="busca-dueno">21 oct · El ### busca dueño</option>
        <option value="quedan">Cualquier día · Quedan X</option>
      </select>
    </label>
    <label>Quedan libres <span class="ayuda">El número grande del tablero (QUEDAN LIBRES).</span>
      <input id="libres" inputmode="numeric" placeholder="ej. 873">
    </label>
    <label>Pagados <span class="ayuda">Solo para el recuento: los PAGADOS del Sheet (no los apartados).</span>
      <input id="vendidos" inputmode="numeric" placeholder="ej. 112">
    </label>
    <label>Número libre <span class="ayuda">Solo para "busca dueño": 3 cifras, del 000 al 999.</span>
      <input id="numero" inputmode="numeric" maxlength="3" placeholder="ej. 314">
    </label>
    <label>Fecha del dato
      <input id="fecha" type="date">
    </label>
    <label class="check"><input type="checkbox" id="libreok"> Revisé en el tablero hoy que ese número está <b>LIBRE</b> (solo para "busca dueño").</label>
  </form>

  <div id="error"></div>

  <div class="previas">
    <div class="previa" id="pf"><canvas id="feed" width="1080" height="1080"></canvas><button id="bf">Descargar feed (1080×1080)</button></div>
    <div class="previa" id="ph"><canvas id="hist" width="1080" height="1920"></canvas><button id="bh">Descargar historia (1080×1920)</button></div>
  </div>
</main>

  if (!F) return "Falta la fecha del dato.";
  if (t === "busca-dueno") {
    if (!/^\d{3}$/.test(N)) return "Escribe el número con 3 cifras (ej. 007, 314).";
    if (!$("libreok").checked) return "Marca la casilla: confirma en el tablero que el " + N + " está LIBRE hoy.";
    return null;
  }
  if (L === null) return "Escribe cuántos quedan libres (solo cifras).";
  if (L > 1000) return "Quedan libres no puede pasar de 1.000.";
  if ((t === "ya-escogieron" || t === "prueba-social") && L === 1000) return "Si quedan 1.000, nadie ha escogido todavía: esta pieza no aplica hoy.";
  if (t === "vamos") {
    if (V === null) return "Escribe cuántos están PAGADOS (solo cifras).";
    if (V + L > 1000) return "Pagados + libres da más de 1.000. Revisa los datos del Sheet.";
  }
  return null;
}

// ---------- dibujo ----------
function caja(ctx, x, y, w, h, fondo, borde = 8) {
  ctx.fillStyle = C.negro; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = fondo; ctx.fillRect(x + borde, y + borde, w - 2 * borde, h - 2 * borde);
}
function texto(ctx, s, x, y, font, color, sombra = 0, align = "left") {
  ctx.font = font; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  if (sombra) { ctx.fillStyle = C.negro; ctx.fillText(s, x + sombra, y + sombra); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function partir(ctx, s, font, ancho) {
  ctx.font = font; const out = []; let linea = "";
  for (const p of s.split(" ")) {
    const prueba = linea ? linea + " " + p : p;
    if (ctx.measureText(prueba).width > ancho && linea) { out.push(linea); linea = p; } else linea = prueba;
  }
  if (linea) out.push(linea); return out;
}
function ajustar(ctx, s, familia, max, ancho, lineasMax) {
  for (let t = max; t > 20; t -= 2) {
    const f = `${t}px ${familia}`; const l = partir(ctx, s, f, ancho);
    if (l.length <= lineasMax && l.every(x => (ctx.font = f, ctx.measureText(x).width <= ancho))) return { f, l, t };
  }
  const f = `20px ${familia}`; return { f, l: partir(ctx, s, f, ancho), t: 20 };
}
function sutaEn(ctx, pose, x, y, w, h) {
  const im = imgs[pose]; if (!im) return;
  const r = Math.min((w - 24) / im.width, (h - 18) / im.height);
  const iw = im.width * r, ih = im.height * r;
  ctx.drawImage(im, x + (w - iw) / 2, y + h - ih, iw, ih);
}
function fechaTxt() {
  const [a, m, d] = $("fecha").value.split("-").map(Number);
  return `DATO REAL DEL TABLERO · ${d} ${MESES[m - 1]} ${a}`;
}
function bloqueCifra(ctx, x, y, w, h, t, L, V, N) {
  caja(ctx, x, y, w, h, C.amarillo);
  const ix = x + 32, iw = w - 64;
  let etiqueta, cifra, debajo;
  if (t === "vamos") { etiqueta = "VAMOS"; cifra = fmt(V); debajo = `de 1.000 · quedan ${fmt(L)} libres`; }
  else if (t === "busca-dueno") { etiqueta = "EL NÚMERO"; cifra = N; debajo = "sigue libre hoy"; }
  else { etiqueta = "QUEDAN LIBRES"; cifra = fmt(L); debajo = "de 1.000 números"; }
  texto(ctx, etiqueta, ix, y + 62, "700 34px 'Archivo Narrow'", C.negro);
  const tam = Math.min(h * 0.5, 250);
  const fc = t === "busca-dueno" ? `700 ${tam}px 'Space Mono'` : `${tam}px 'Alfa Slab One'`;
  ctx.font = fc; let s = tam; while (ctx.measureText(cifra).width > iw && s > 60) { s -= 6; ctx.font = t === "busca-dueno" ? `700 ${s}px 'Space Mono'` : `${s}px 'Alfa Slab One'`; }
  texto(ctx, cifra, ix, y + 70 + s * 0.86, ctx.font, t === "busca-dueno" ? C.rojo : C.negro);
  texto(ctx, debajo, ix, y + h - 34, "600 36px 'Archivo Narrow'", C.negro);
}
function cta(ctx, x, y, w, h, vertical) {
  caja(ctx, x, y, w, h, C.crema);
  if (vertical) {
    texto(ctx, "ESCOGE EL TUYO →", x + 30, y + 70, "54px 'Alfa Slab One'", C.rojo);
    texto(ctx, "mega-rifa-fusa.vercel.app", x + 30, y + h - 30, "700 34px 'Space Mono'", C.negro);
  } else {
    texto(ctx, "ESCOGE EL TUYO →", x + 28, y + h / 2 + 14, "38px 'Alfa Slab One'", C.rojo);
    texto(ctx, "mega-rifa-fusa.vercel.app", x + w - 28, y + h / 2 + 10, "700 28px 'Space Mono'", C.negro, 0, "right");
  }
}
function tope(ctx, W, pad, y, chip, chipTam) {
  ctx.font = `700 ${chipTam}px 'Space Mono'`;
  const cw = ctx.measureText(chip).width + chipTam * 0.12 * chip.length + 44;
  caja(ctx, pad, y, cw, chipTam + 34, C.crema, 6);
  ctx.save(); ctx.letterSpacing = "3px"; texto(ctx, chip, pad + 22, y + chipTam + 10, `700 ${chipTam}px 'Space Mono'`, C.rojo); ctx.restore();
  texto(ctx, "MEGA RIFA FUSA", W - pad, y + chipTam + 12, "36px 'Alfa Slab One'", C.crema, 3, "right");
}

function dibujarFeed(cv, d) {
  const ctx = cv.getContext("2d"), W = 1080, H = 1080, P = 44;
  ctx.fillStyle = C.rojo; ctx.fillRect(0, 0, W, H);
  tope(ctx, W, P, P, d.cfg.chip, 26);
  const panelW = 290, colW = W - 2 * P - panelW - 24;
  const tt = ajustar(ctx, d.tit, "'Alfa Slab One'", 76, colW, 2);
  let y = 150 + tt.t;
  tt.l.forEach(l => { texto(ctx, l, P, y, tt.f, C.crema, 6); y += tt.t * 1.02; });
  const by = y + 4, bh = 850 - by;
  bloqueCifra(ctx, P, by, colW, bh, d.t, d.L, d.V, d.N);
  caja(ctx, W - P - panelW, 128, panelW, by + bh - 128, C.crema);
  sutaEn(ctx, d.cfg.pose, W - P - panelW + 8, 136, panelW - 16, by + bh - 136);
  const sy = by + bh + 42;
  texto(ctx, fechaTxt() + (d.cfg.sub ? "   " + d.cfg.sub : ""), P, sy, "700 24px 'Space Mono'", C.crema);
  cta(ctx, P, sy + 22, W - 2 * P, 96, false);
  texto(ctx, "Organizada por Santiago · The Ber Way", W / 2, H - 30, "600 22px 'Archivo Narrow'", C.crema, 0, "center");
}

function dibujarHist(cv, d) {
  const ctx = cv.getContext("2d"), W = 1080, H = 1920, P = 60;
  ctx.fillStyle = C.rojo; ctx.fillRect(0, 0, W, H);
  tope(ctx, W, P, 230, d.cfg.chip, 28);
  const tt = ajustar(ctx, d.tit, "'Alfa Slab One'", 108, W - 2 * P, 3);
  let y = 350 + tt.t;
  tt.l.forEach(l => { texto(ctx, l, P, y, tt.f, C.crema, 7); y += tt.t * 1.02; });
  const by = y + 10, panelW = 300;
  const bh = Math.max(420, Math.min(620, 1390 - by - (d.cfg.sub ? 80 : 0)));
  bloqueCifra(ctx, P, by, W - 2 * P - panelW - 20, bh, d.t, d.L, d.V, d.N);
  caja(ctx, W - P - panelW, by, panelW, bh, C.crema);
  sutaEn(ctx, d.cfg.pose, W - P - panelW + 8, by + 8, panelW - 16, bh - 16);
  if (d.cfg.sub) texto(ctx, d.cfg.sub, P, by + bh + 72, "700 50px 'Archivo Narrow'", C.crema);
  texto(ctx, fechaTxt(), P, 1480, "700 28px 'Space Mono'", C.crema);
  cta(ctx, P, 1505, W - 2 * P, 150, true);
  texto(ctx, "Organizada por Santiago · The Ber Way", W / 2, 1700, "600 28px 'Archivo Narrow'", C.crema, 0, "center");
}

function vacio(cv, msg) {
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#ddd"; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = "#555"; ctx.font = "700 40px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("Completa los datos", cv.width / 2, cv.height / 2);
}

function pintar() {
  const err = validar();
  $("error").style.display = err ? "block" : "none"; $("error").textContent = err || "";
  $("bf").disabled = $("bh").disabled = !!err;
  if (err) { vacio($("feed")); vacio($("hist")); return; }
  const t = $("tipo").value;
  const d = { t, cfg: TIPOS[t], L: entero($("libres").value), V: entero($("vendidos").value), N: $("numero").value.trim() };
  d.tit = t === "busca-dueno" ? `EL ${d.N} ${d.cfg.tit}` : d.cfg.tit;
  dibujarFeed($("feed"), d); dibujarHist($("hist"), d);
}

function descargar(cv, nombre) {
  if (validar()) return;
  cv.toBlob(b => { const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = nombre; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }, "image/png");
}
$("bf").onclick = () => descargar($("feed"), `${$("tipo").value}-feed-${$("fecha").value}.png`);
$("bh").onclick = () => descargar($("hist"), `${$("tipo").value}-historia-${$("fecha").value}.png`);
["tipo", "libres", "vendidos", "numero", "fecha", "libreok"].forEach(id => $(id).addEventListener("input", pintar));
$("numero").addEventListener("blur", () => { const v = $("numero").value.trim(); if (/^\d{1,2}$/.test(v)) { $("numero").value = v.padStart(3, "0"); pintar(); } });

// Valores desde la URL (para probar): ?tipo=vamos&libres=880&vendidos=112&fecha=2026-10-18&solo=feed
const q = new URLSearchParams(location.search);
$("fecha").value = q.get("fecha") || new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
["tipo", "libres", "vendidos", "numero"].forEach(k => { if (q.get(k)) $(k).value = q.get(k); });
if (q.get("libreok")) $("libreok").checked = true;
if (q.get("solo")) { document.body.classList.add("solo"); $(q.get("solo") === "feed" ? "pf" : "ph").classList.add("mostrar"); }

Promise.all([
  ...Object.entries(SUTA).map(([k, src]) => new Promise(r => { const im = new Image(); im.onload = () => { imgs[k] = im; r(); }; im.onerror = r; im.src = src; })),
  document.fonts.load("40px 'Alfa Slab One'"), document.fonts.load("600 40px 'Archivo Narrow'"),
  document.fonts.load("700 40px 'Archivo Narrow'"), document.fonts.load("700 40px 'Space Mono'"),
]).then(() => {
  fuentesOK = document.fonts.check("40px 'Alfa Slab One'") && document.fonts.check("700 40px 'Space Mono'");
  pintar();
});
</script>
